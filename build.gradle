plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = mod_group_id
version = "${mod_version}-neoforge-mc${minecraft_version}"

base {
    archivesName = "nmbl"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file("run/client")
            programArguments = ["--username", "_IMG_"]
        }

        client2 {
            client()
            gameDirectory = project.file("run/client2")
            programArguments = ["--username", "tartaric_acid"]
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file("run/server-1.21")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel.cloth"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

configurations {
    mcLib
    implementation.extendsFrom mcLib
    minecraftLibrary.extendsFrom mcLib
    runtimeClasspath.extendsFrom localRuntime
    additionalRuntimeClasspath.extendsFrom mcLib
}

dependencies {
    // Cloth Config
    implementation ("me.shedaniel.cloth:cloth-config-neoforge:15.0.140")

    // 网络音乐机
    implementation ('maven.modrinth:net-music:1.5.1-neoforge+mc1.21.1')

    // 车万女仆
    runtimeOnly ('maven.modrinth:touhou-little-maid:1.5.2-neoforge+mc1.21.1')

    // 精妙背包
    runtimeOnly ("maven.modrinth:sophisticated-core:1.21.1-1.4.2.1467")
    runtimeOnly ("maven.modrinth:sophisticated-backpacks:1.21.1-3.25.25.1514")

    // zxing 二维码
    mcLib "com.google.zxing:core:3.5.4"

    // junit
    testImplementation 'junit:junit:4.13.2'
}

shadowJar {
    configurations = [project.configurations.mcLib]

    dependencies {
        exclude(dependency('junit:junit'))
    }

    relocationPrefix = 'com.github.img.netmusicbetterlogin.libs'
    enableAutoRelocation = true

    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**/*'
}

jar {
    enabled = false
}

assemble {
    dependsOn shadowJar
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            netmusic_version_range : netmusic_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}